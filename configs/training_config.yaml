training:
  random_seed: 42
  train_ratio: 0.8
  val_ratio: 0.1
  test_ratio: 0.1
  
  gpu:
    enabled: true
    device: "0"
    mixed_precision:
      enabled: true
      policy: "float16"
  
  deep_learning:
    batch_size: 32
    epochs: 50
    early_stopping_patience: 5
    learning_rate: 0.01
    weight_decay: 0.0001
    optimizer: "adamw"
  
  class_weights:
    enabled: true
    mode: "balanced"